<!DOCTYPE html>
<!-- Synthetic classic feedback page whose first list already holds only a
     negative review, but fewer than the 12-month count: the extractor must
     still click and wait for the whole list (2 rows). -->
<html>
<head><meta charset="utf-8"><title>Feedback Profile</title></head>
<body>
<h2><span>seller-a (40)</span></h2>
<table>
  <tr><th></th><th><span>1 month</span></th><th><span>6 months</span></th><th><span>12 months</span></th></tr>
  <tr><td>Negative</td>
    <td><button aria-label="negative feedback in last 1 month">1</button></td>
    <td><button aria-label="negative feedback in last 6 months">2</button></td>
    <td><button id="neg12" aria-label="negative feedback in last 12 months">2</button></td></tr>
</table>
<table id="feedback-cards">
  <tbody id="rows">
    <tr><td><div class="card__rating"><svg class="icon icon--feedback-negative"></svg></div><div class="card__comment">Late</div></td>
      <td><div class="card__from">Buyer: x***1 (4)</div></td><td><div class="card__links">Past month</div></td></tr>
  </tbody>
</table>
<script>
document.getElementById('neg12').addEventListener('click', function () {
  setTimeout(function () {
    document.getElementById('rows').innerHTML =
      '<tr><td><div class="card__rating"><svg class="icon icon--feedback-negative"></svg></div><div class="card__comment">Late</div></td>' +
      '<td><div class="card__from">Buyer: x***1 (4)</div></td><td><div class="card__links">Past month</div></td></tr>' +
      '<tr><td><div class="card__rating"><svg class="icon icon--feedback-negative"></svg></div><div class="card__comment">Broken on arrival</div></td>' +
      '<td><div class="card__from">Buyer: y***2 (9)<div class="card__price">US $12.00</div>Verified purchase</div></td>' +
      '<td><div class="card__links">Past 6 months</div></td></tr>';
  }, 300);
});
</script>
</body>
</html>
